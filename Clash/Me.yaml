# ================================================================
# Mihomo 隐私增强客户端配置（Me.yaml）
#
# 基于官方 Mihomo 配置示例编写。
# 使用方式：
# 1. 把下方“订阅一/订阅二”的 url 换成你自己的订阅地址。
# 2. 使用支持 Mihomo 的客户端加载本文件。
# 3. Windows/Linux 启用 TUN 时使用管理员或 root 权限。
#
# 这份配置默认采用“公网流量走代理、仅本机和内网地址直连”的策略。
# 全球流量按“地区 + 服务 + 国内细分”规则组分流，公网不存在 DIRECT 兜底；
# 仅本机、局域网、链路本地和 Tailnet 地址允许直连。
#
# 强加密说明：
# - 公网 DNS 只使用 DoH/DoT，DIRECT 出口域名也通过国内加密 DoH 解析。
# - 统一 TLS 客户端指纹，减少不同协议之间的指纹差异。
# - 订阅/规则更新首次启动必须直连（此时还没有节点），启动一次获得节点后，
#   可在面板中把 provider 的代理改为“节点选择”，让后续更新也走代理。
# ================================================================

# ------------------------- 基础监听 -------------------------
# HTTP、HTTPS、SOCKS5 共用一个端口，客户端通常只需要填写这一端口。
mixed-port: 7890

# 不允许局域网设备连接本机代理，避免代理端口被同网段设备滥用。
allow-lan: false
bind-address: 127.0.0.1

# 规则模式：所有连接按照下方 rules 从上到下匹配。
mode: rule

# 日志等级。生产环境使用 warning，避免日志泄露访问域名和连接细节。
log-level: warning

# 关闭 IPv6，避免系统或节点 IPv6 不完整时出现 IPv6 绕过代理。
ipv6: false

# 不匹配进程名。适合 Windows、Linux 桌面和路由器，减少进程信息暴露。
find-process-mode: off

# 统一延迟计算方式，减少不同节点握手方式造成的测试偏差。
unified-delay: true

# 不并发连接同一域名的多个地址，减少额外连接和侧信道信息。
tcp-concurrent: false

# TCP 长连接保活间隔，降低移动设备频繁建立连接的次数。
keep-alive-interval: 1800

# ------------------------- 外部控制 -------------------------
# 控制器只监听本机。不要改成 0.0.0.0，除非你明确需要远程控制。
external-controller: 127.0.0.1:9090

# 面板/API 认证密钥。请重新生成随机长字符串，不要在公开仓库提交。
secret: "c30875e47112c8ec7e13506781804f18c90da19b10e65d9e5035da507dc853f4"

# ------------------------- Geo 数据 -------------------------
# 官方 Geo 数据地址。首次启动会下载这些文件，下载请求可能直连。
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# 不自动后台更新 Geo 数据，减少不可预期的外部请求。
# 需要更新时删除对应缓存文件后重新启动 Mihomo。
geo-auto-update: false
geo-update-interval: 24

# ------------------------- 本地文件与状态 -------------------------
# 只保留必要的选择状态；fake-ip 映射不持久化，减少本地长期记录。
profile:
  store-selected: false
  store-fake-ip: false

# 统一 TLS 客户端指纹，降低不同协议之间的指纹差异。
global-client-fingerprint: chrome

# 可在这里写入局域网域名或自定义 hosts。默认留空。
hosts: {}

# ------------------------- 订阅提供者 -------------------------
# 节点从订阅加载，不在配置中硬编码节点密码。
# path 使用相对路径，目录会位于 Mihomo 工作目录下。
# provider 的 proxy 明确写为 DIRECT：首次启动没有可用节点，无法自代理下载。
proxy-providers:
  订阅一:
    type: http
    url: "https://example.com/replace-with-your-subscription-1"
    path: ./proxy_provider/订阅一.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      interval: 600
      timeout: 5000
      url: https://cp.cloudflare.com/generate_204

  订阅二:
    type: http
    url: "https://example.com/replace-with-your-subscription-2"
    path: ./proxy_provider/订阅二.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      interval: 600
      timeout: 5000
      url: https://cp.cloudflare.com/generate_204

# 如果只使用一个订阅，可以删除“订阅二”，并从下方 use 列表中删除对应名称。

# ------------------------- 规则提供者 -------------------------
# 广告规则使用官方 GitHub 原始地址，不使用第三方加速域名。
rule-providers:
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    path: ./rule_provider/AWAvenue-Ads.yaml
    interval: 86400
    proxy: DIRECT

# ------------------------- NTP 与嗅探 -------------------------
# 关闭 NTP，避免 Mihomo 自动向时间服务器发出额外请求。
ntp:
  enable: false
  write-to-system: false

# 关闭域名嗅探。这样 Mihomo 不会主动从 TLS/HTTP 流量中提取域名。
sniffer:
  enable: false

# ------------------------- TUN 全局接管 -------------------------
# TUN 用于接管不支持显式代理的应用。
# Windows 需要管理员权限；Linux 的 auto-redirect 需要 nftables/iptables 支持。
tun:
  enable: true
  stack: system
  dns-mode: hijack
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

# ------------------------- DNS 防泄漏 -------------------------
dns:
  enable: true
  cache-algorithm: arc
  # 仅本机 DNS 监听；TUN 会把系统 DNS 请求转交到内部 DNS 模块。
  listen: 127.0.0.1:1053
  ipv6: false
  use-hosts: true

  # fake-ip 可让域名请求统一进入规则系统；本地域名在下面排除。
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "localhost"

  # 仅使用加密 DNS 引导解析。这里使用 IP 地址，避免引导阶段再次依赖域名解析。
  default-nameserver:
    - tls://1.1.1.1:853
    - tls://9.9.9.9:853

  # 公网 DNS 通过 dns 策略组发送，避免明文 UDP/53。
  nameserver:
    - "https://cloudflare-dns.com/dns-query#dns"
    - "https://dns.google/dns-query#dns"

  # 节点服务器域名的引导解析。该阶段必须直连，否则会和节点加载互相依赖；
  # 这是启动引导期的明文 DNS 暴露点，节点加载完成后无法完全消除。
  proxy-server-nameserver:
    - tls://1.1.1.1:853
    - tls://9.9.9.9:853

  # 本地网络域名使用系统解析器，不发送到公共 DNS。
  nameserver-policy:
    "+.lan":
      - system://
    "+.local":
      - system://
    "+.home.arpa":
      - system://
    "localhost":
      - system://

  # DIRECT 规则命中的域名使用国内加密 DoH 解析，并遵循上面的 nameserver-policy；
  # 本地域名仍由 nameserver-policy 指定为 system://。
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  respect-rules: true

# 没有静态节点时显式使用空数组，避免把官方示例中的伪造节点带入实际配置。
proxies: []

# ------------------------- 策略组 -------------------------
# 统一的节点选择组。所有公网策略组都不包含 DIRECT，避免节点失效时明文回落。
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 全部节点
      - 香港
      - 台湾
      - 日本
      - 韩国
      - 新加坡
      - 美国
      - 加拿大
      - 英国
      - 德国
      - 澳大利亚
      - 其它地区

  # 公网 DNS 使用该组，节点选择跟随“节点选择”。
  - name: dns
    type: select
    proxies:
      - 节点选择
      - 自动选择

  # 广告命中后默认拒绝；需要排查误杀时可临时切换到节点选择。
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - 节点选择

  - name: 学术
    type: select
    proxies: [节点选择, 自动选择]
  - name: 境外AI
    type: select
    proxies: [节点选择, 自动选择]
  - name: Apple
    type: select
    proxies: [节点选择, 自动选择]
  - name: Google
    type: select
    proxies: [节点选择, 自动选择]
  - name: Telegram
    type: select
    proxies: [节点选择, 自动选择]
  - name: Twitter
    type: select
    proxies: [节点选择, 自动选择]
  - name: Pixiv
    type: select
    proxies: [节点选择, 自动选择]
  - name: ehentai
    type: select
    proxies: [节点选择, 自动选择]
  - name: YouTube
    type: select
    proxies: [节点选择, 自动选择]
  - name: NETFLIX
    type: select
    proxies: [节点选择, 自动选择]
  - name: TikTok
    type: select
    proxies: [节点选择, 自动选择]
  - name: Spotify
    type: select
    proxies: [节点选择, 自动选择]
  - name: Github
    type: select
    proxies: [节点选择, 自动选择]
  - name: Steam
    type: select
    proxies: [节点选择, 自动选择]
  - name: OneDrive
    type: select
    proxies: [节点选择, 自动选择]
  - name: 微软服务
    type: select
    proxies: [节点选择, 自动选择]

  # 国内长视频/直播，默认走代理并按地区自动选择，便于解锁地域版权。
  - name: 国内流媒体
    type: select
    proxies: [节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 加拿大, 英国, 德国, 澳大利亚, 其它地区]

  # 国内社交、工具、购物等常用站点，默认走代理避免明文直连。
  - name: 国内社交工具
    type: select
    proxies: [节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 加拿大, 英国, 德国, 澳大利亚, 其它地区]

  # 国内音乐平台，默认走代理避免明文直连。
  - name: 国内音乐
    type: select
    proxies: [节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 加拿大, 英国, 德国, 澳大利亚, 其它地区]

  # 中国大陆流量也默认经过代理，避免应用自行直连造成出口暴露。
  - name: 国内
    type: select
    proxies: [节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 加拿大, 英国, 德国, 澳大利亚, 其它地区]

  # 没有命中其他规则的公网流量最终进入该组。
  - name: 其他
    type: select
    proxies: [节点选择, 自动选择, 全部节点, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 加拿大, 英国, 德国, 澳大利亚, 其它地区]

  # 以下是地区节点组。filter 会从所有订阅节点名称中筛选对应地区。
  - name: 香港
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)港|hk|hong ?kong"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 台湾
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)台|tw|taiwan"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 日本
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)日本|jp|japan"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 新加坡
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)新|sg|singapore"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 美国
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)美|us|united ?states"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 韩国
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)韩|kr|korea"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 加拿大
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)加|ca|canada"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 英国
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)英|uk|united ?kingdom"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 德国
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)德|de|germany"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 澳大利亚
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)澳|au|australia"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 其它地区
    type: url-test
    use: [订阅一, 订阅二]
    filter: "(?i)^(?!.*(?:港|hk|hong ?kong|台|tw|taiwan|日|jp|japan|韩|kr|korea|新|sg|singapore|美|us|united ?states|加|ca|canada|英|uk|united ?kingdom|德|de|germany|澳|au|australia)).+"
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 全部节点
    type: url-test
    use: [订阅一, 订阅二]
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100

  - name: 自动选择
    type: url-test
    use: [订阅一, 订阅二]
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50

# ------------------------- 分流规则 -------------------------
rules:
  # 本机、局域网、链路本地和 Tailnet 地址允许直连，避免破坏局域网服务。
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 广告规则优先匹配。
  - RULE-SET,AWAvenue-Ads,广告拦截

  # 常用服务分流。
  - GEOSITE,category-scholar-!cn,学术
  - GEOSITE,category-ai-!cn,境外AI
  - GEOSITE,apple,Apple
  - GEOSITE,apple-cn,Apple
  - GEOSITE,ehentai,ehentai
